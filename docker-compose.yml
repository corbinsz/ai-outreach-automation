# Local only. The published port is bound to loopback.
# Demo mode is on, so no API key is required.

services:
  outreach:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DEMO_MODE: "1"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
