[theme]
primaryColor = "#4a8fd9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1e2a3a"

[browser]
# Local project. Do not send usage stats to Streamlit.
gatherUsageStats = false

[client]
# "minimal" removes the toolbar that offers a one-click deploy.
toolbarMode = "minimal"

[server]
# Leave the bind address unset. `make demo` and `make run` pass
# --server.address 127.0.0.1 so a laptop stays on loopback. Docker sets
# STREAMLIT_SERVER_ADDRESS=0.0.0.0 so a published port can reach the process.
runOnSave = true
